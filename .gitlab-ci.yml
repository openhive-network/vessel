# GitLab CI for Vessel (replaces .travis.yml).
#
# Pipeline: verify → build (electron-vite) → e2e (Playwright _electron under xvfb) → package.
#
# Notes:
#  • Node comes only from common-ci-configuration (ccc): the Node jobs run in ccc's node-test-tools
#    image (${NODE_TEST_TOOLS_IMAGE}), which carries the hive-wide Node (ccc's docker-bake.hcl
#    NODE_VERSION, exported as NODE_IMAGE_VERSION) and pnpm. This file names no Node version or Node image.
#  • Dependencies install with pnpm from pnpm-lock.yaml. React, TypeScript and Playwright are
#    `catalog:` references resolved through ccc's catalogs, which pnpm-workspace.yaml carries
#    between its BEGIN/END markers. The npm-common-config submodule (ccc) is checked out at ccc's
#    develop tip (GIT_SUBMODULE_UPDATE_FLAGS: --remote) and ccc's .pnpm_install_with_catalog_fallback
#    re-merges its catalogs before installing, so a ccc catalog bump reaches the next pipeline; the
#    install then reruns unfrozen and keeps the refreshed lockfile as the
#    pnpm-lock.catalog-refreshed.yaml artifact, to be committed with the submodule bump.
#  • The whole toolchain is electron-vite/vite — everything (dev, build, package) bundles into out/.
#  • Code signing ships dark: electron-builder signs/notarizes only when CSC_LINK / CSC_KEY_PASSWORD,
#    WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD and APPLE_* are set as protected CI variables; without them it
#    packages unsigned and build/signingNotice.js says so in the job log.
#  • macOS packaging is a manual local `pnpm run package` step — there is no hosted mac runner.
#    Add a `package:mac` job here if/when a tagged mac runner exists.

include:
  - project: 'hive/common-ci-configuration'
    ref: develop
    file: '/templates/npm_projects.gitlab-ci.yml' # includes base.gitlab-ci.yml

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_UPDATE_FLAGS: --remote
  CCC_SUBMODULE_DIR: npm-common-config

stages:
  - verify
  - build
  - e2e
  - package

default:
  image: ${NODE_TEST_TOOLS_IMAGE}
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
  before_script:
    - node -v
    - pnpm -v
    - git submodule status --recursive # which ccc catalog this job installs against
    - pnpm config set store-dir "${CI_PROJECT_DIR}/.pnpm-store"
    - !reference [.pnpm_install_with_catalog_fallback, script]

verify:
  stage: verify
  interruptible: true
  script:
    - pnpm run verify # typecheck && lint && test
  artifacts:
    when: always
    paths:
      - pnpm-lock.catalog-refreshed.yaml
    expire_in: 1 week

# Reports (allowed to fail) when the committed pnpm-workspace.yaml is behind ccc's catalogs.
pnpm_catalog_check:
  extends: .pnpm_catalog_check
  stage: verify
  before_script: []

build:
  stage: build
  interruptible: true
  script:
    - pnpm run build
  artifacts:
    paths:
      - out/
    expire_in: 1 day

e2e:
  stage: e2e
  interruptible: true
  needs: ['build']
  script:
    - pnpm exec playwright install-deps # OS libraries electron/chromium need
    - xvfb-run --auto-servernum pnpm run test-e2e
  artifacts:
    when: on_failure
    paths:
      - test-results/
    expire_in: 1 week

package:linux:
  stage: package
  needs: ['build']
  script:
    - apt-get update && apt-get install -y --no-install-recommends binutils # fpm builds the .deb with `ar`
    - pnpm run package-linux
  artifacts:
    paths:
      - release/*.deb
    expire_in: 1 week

# Windows: electron-builder edits and signs the .exe with rcedit/signtool, which on a Linux runner
# need wine — node-test-tools has none, so this job keeps electronuserland/builder:wine. That image
# ships its own Node, so the job first installs ccc's Node (NODE_IMAGE_VERSION, from the included
# base template) in front of it and fails unless `node -v` reports exactly that version, then the
# pnpm ccc's images carry (docker-bake.hcl's PNPM_VERSION, read from the submodule).
package:win:
  stage: package
  image: electronuserland/builder:wine
  rules:
    - if: '$CI_COMMIT_TAG'
  before_script:
    - curl -fsSL "https://nodejs.org/dist/v${NODE_IMAGE_VERSION}/node-v${NODE_IMAGE_VERSION}-linux-x64.tar.xz" | tar -xJ -C /opt
    - export PATH="/opt/node-v${NODE_IMAGE_VERSION}-linux-x64/bin:${PATH}"
    - test "$(node -v)" = "v${NODE_IMAGE_VERSION}"
    - node -v
    - PNPM_VERSION="$(sed -n '/^variable "PNPM_VERSION"/,/^}/s/^ *default *= *"\(.*\)"/\1/p' "${CCC_SUBMODULE_DIR}/docker-bake.hcl")"
    - npm install -g "pnpm@${PNPM_VERSION:?no PNPM_VERSION in ccc's docker-bake.hcl}"
    - pnpm -v
    - pnpm config set store-dir "${CI_PROJECT_DIR}/.pnpm-store"
    - !reference [.pnpm_install_with_catalog_fallback, script]
  script:
    - pnpm run package-win
  artifacts:
    paths:
      - release/
    expire_in: 1 week
